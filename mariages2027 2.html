<title>Planning Mariages</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1a;font-size:15px;}
input,select,textarea,button{font-family:inherit;font-size:15px;}
button{cursor:pointer;-webkit-appearance:none;}
textarea{resize:vertical;}
/* ── Responsive layout ── */
.page{display:none;position:fixed;inset:0;background:#f5f5f5;overflow-y:auto;}
.page.active{display:block;}

/* Mobile : centré 480px */
@media (max-width:767px){
  .page{max-width:480px;margin:0 auto;}
  #login-screen{max-width:480px;margin:0 auto;}
}

/* Tablette : 768px+ */
@media (min-width:768px){
  body{background:#e8eef2;}
  .page{max-width:100%;background:#e8eef2;}
  #page-cal .topbar,#page-cal .navbar,#page-cal .legend,#page-cal .daynames,#page-cal .calgrid,#page-cal .sres{max-width:700px;margin:0 auto;}
  #page-day,#page-form{max-width:700px;margin:0 auto;background:#f5f5f5;border-radius:0;}
  .topbar,#page-day .topbar,#page-form .form-topbar{max-width:700px;margin:0 auto;}
}

/* Desktop : 1100px+ — deux colonnes */
@media (min-width:1100px){
  body{background:#e0e6ea;}
  #page-cal{display:flex;flex-direction:column;align-items:center;}
  #page-cal .topbar{width:100%;max-width:100%;background:#fff;border-bottom:1px solid #e5e5e5;}
  #page-cal .topbar .topbar-row,#page-cal .topbar .search-wrap{max-width:1200px;margin:0 auto;}
  #page-cal .navbar,#page-cal .legend,#page-cal .daynames,#page-cal .calgrid,#page-cal .sres{max-width:1200px;width:100%;}
  #page-cal .navbar{position:sticky;top:105px;max-width:1200px;}
  #page-day,#page-form{max-width:860px;margin:0 auto;background:#f5f5f5;border-left:1px solid #ddd;border-right:1px solid #ddd;}
  .wcard{margin:8px 16px;}
  .calgrid{grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 0 100px;}
  .cell{min-height:80px;padding:6px 4px;}
  .cell-num{font-size:15px;}
  .ftabs,.itabs{max-width:860px;}
  #login-screen{max-width:440px;}
}

/* ── Login screen ── */
#login-screen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:40px 30px;}
#login-screen .login-logo{font-size:48px;margin-bottom:8px;}
#login-screen .login-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
#login-screen .login-sub{font-size:13px;color:#bbb;margin-bottom:32px;}
#login-screen input{width:100%;background:#f7f7f7;border:1px solid #eee;border-radius:10px;padding:14px 16px;font-size:16px;outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px;box-sizing:border-box;}
#login-screen input:focus{border-color:#5b9ab5;}
#login-screen .login-btn{width:100%;background:#5b9ab5;border:none;color:#fff;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
#login-screen .login-err{color:#c04040;font-size:13px;margin-top:8px;display:none;}
#loading-screen .spin{width:36px;height:36px;border:3px solid #eee;border-top-color:#5b9ab5;border-radius:50%;animation:spin .8s linear infinite;}
#loading-screen p{font-size:14px;color:#999;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Error banner */
.err-banner{background:#fff0f0;border:1px solid #f0c0c0;color:#c04040;padding:10px 14px;font-size:12px;line-height:1.5;margin:10px 14px;border-radius:8px;display:none;}

/* Topbar */
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 16px;position:sticky;top:0;z-index:20;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar-title{font-size:17px;font-weight:700;}
.topbar-sub{font-size:11px;color:#bbb;margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sync{font-size:10px;color:#bbb;transition:color .3s;}
.sync.saving{color:#f0a000;}
.sync.ok{color:#5a9a5a;}
.sync.err{color:#c04040;}
.btn-primary{background:#5b9ab5;border:none;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.btn-back{background:none;border:none;color:#5b9ab5;font-size:14px;font-weight:600;padding:0;}
.btn-secondary{background:#eef5f8;border:1px solid #c2dcea;color:#5b9ab5;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.btn-danger{background:#fff5f5;border:1px solid #f0d0d0;color:#c87070;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}

/* Search */
.search-wrap{position:relative;margin-top:10px;}
.search-input{width:100%;background:#f7f7f7;border:1px solid #eee;border-radius:8px;padding:9px 14px;font-size:14px;outline:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#bbb;font-size:18px;}

/* Navbar */
.navbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:8px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:105px;z-index:19;}
.nav-btn{background:none;border:1px solid #e5e5e5;border-radius:6px;padding:6px 12px;font-size:16px;color:#555;flex-shrink:0;}
.nav-selects{display:flex;gap:6px;flex:1;}
.nav-sel{background:#f7f7f7;border:1px solid #e5e5e5;border-radius:8px;padding:7px 10px;font-size:14px;font-weight:600;color:#1a1a1a;outline:none;-webkit-appearance:none;flex:1;text-align:center;}
.nav-sel-year{max-width:90px;}

/* Legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid #f0f0f0;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#999;}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.leg-box{width:12px;height:10px;border-radius:2px;background:#eef5f8;}

/* Day names */
.daynames{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;padding:4px 8px 2px;position:sticky;top:153px;z-index:18;border-bottom:1px solid #f0f0f0;}
.dayname{text-align:center;font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;padding:4px 0;}
.dayname.sat{color:#5b9ab5;}

/* Calendar grid */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 8px 100px;}
.cell{min-height:52px;border-radius:6px;padding:4px 2px;cursor:pointer;}
.cell:active{opacity:.7;}
.cell.other{opacity:.2;pointer-events:none;}
.cell.sat{background:#eef5f8;}
.cell.closed{background:#f0f0f0;}
.cell-num{text-align:center;font-size:13px;font-weight:500;line-height:22px;}
.cell-num.sat{color:#5b9ab5;font-weight:700;}
.cell-num.today{background:#5b9ab5;color:#fff;border-radius:50%;width:22px;height:22px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
.cell-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;}
.cell-dot{width:5px;height:5px;border-radius:50%;}
.cell-full{font-size:7px;color:#c87070;font-weight:700;text-transform:uppercase;text-align:center;margin-top:2px;}

/* Search results */
.sres{background:#fff;padding:12px 16px;border-bottom:1px solid #eee;display:none;}
.sres-hdr{font-size:10px;color:#5b9ab5;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px;}
.sres-row{padding:10px 0;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.sres-name{font-size:15px;font-weight:500;}
.sres-sub{font-size:11px;color:#999;margin-top:2px;}

/* Day page */
.day-notice{background:#fef8ee;border:1px solid #f0ddb0;border-radius:8px;padding:10px 14px;margin:12px 14px;font-size:12px;color:#a07030;line-height:1.5;}
.closed-row{display:flex;align-items:center;justify-content:space-between;margin:12px 14px;padding:11px 14px;background:#fff;border-radius:10px;border:1px solid #eee;}
.closed-lbl{font-size:13px;color:#555;}

/* Wedding card */
.wcard{background:#fff;border-radius:10px;margin:8px 12px;overflow:hidden;border:1px solid #eee;}
.wcard-stripe{height:3px;}
.wcard-hdr{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.wcard-name{font-size:16px;font-weight:500;}
.wcard-sub{font-size:11px;color:#bbb;margin-top:3px;}
.wcard-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.wbadge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.warr{font-size:11px;color:#ddd;}

/* Card tabs */
.itabs{display:flex;overflow-x:auto;border-bottom:1px solid #eee;}
.itabs::-webkit-scrollbar{height:0;}
.itab{flex-shrink:0;padding:10px 13px;background:transparent;border:none;font-size:12px;color:#bbb;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;cursor:pointer;}
.itab.on{color:#5b9ab5;font-weight:700;border-bottom-color:#5b9ab5;}

/* Tab content */
.tab-body{padding:14px 14px 20px;}
.sect-title{font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.info-block{background:#f9f9f9;border-radius:8px;overflow:hidden;margin-bottom:12px;}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 13px;border-bottom:1px solid #f0f0f0;}
.info-row:last-child{border-bottom:none;}
.info-lbl{font-size:12px;color:#bbb;flex-shrink:0;margin-right:12px;}
.info-val{font-size:13px;color:#1a1a1a;font-weight:500;text-align:right;flex:1;word-break:break-word;}
.info-val.em{color:#ccc;font-weight:400;font-style:italic;}
a.clink{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f9f9f9;border-radius:8px;margin-bottom:8px;text-decoration:none;border:1px solid #eee;}
.clink-lbl{font-size:11px;color:#bbb;font-weight:700;text-transform:uppercase;width:52px;flex-shrink:0;}
.clink-val{font-size:14px;color:#1a1a1a;font-weight:500;}
.map-row{display:flex;gap:8px;margin-top:10px;}
a.mapbtn{flex:1;text-decoration:none;padding:10px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;display:block;}
a.mapbtn.blue{background:#eef5f8;color:#5b9ab5;border:1px solid #c2dcea;}
a.mapbtn.grn{background:#f0faf5;color:#5a8a5a;border:1px solid #b8d8c0;}
.pay-total{background:#1a1a1a;border-radius:10px;padding:16px;margin-bottom:14px;}
.pay-total-lbl{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.pay-total-val{font-size:36px;font-weight:300;color:#fff;line-height:1;}
.pay-total-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:6px;}
.slot-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:#f9f9f9;border-radius:7px;margin-bottom:6px;}
.slot-time{font-size:12px;font-weight:700;color:#5b9ab5;min-width:92px;flex-shrink:0;padding-top:2px;}
.slot-name{font-size:14px;font-weight:500;}
.slot-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.stag{font-size:10px;padding:2px 8px;border-radius:10px;}
.stag.sky{background:#eef5f8;color:#5b9ab5;}
.stag.gld{background:#fdf8f0;color:#b89c6e;}
.coif-blk{background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:10px;overflow:hidden;}
.coif-blk-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:#f9f9f9;border-bottom:1px solid #eee;}
.coif-blk-name{font-size:14px;font-weight:600;}
.coif-blk-cnt{font-size:11px;color:#bbb;}
.coif-blk-body{padding:10px 13px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag{padding:6px 12px;border-radius:20px;border:1.5px solid #eee;background:#fff;font-size:12px;color:#999;cursor:pointer;}
.tag.sky{border-color:#5b9ab5;background:#eef5f8;color:#5b9ab5;font-weight:600;}
.tag.gld{border-color:#b89c6e;background:#fdf8f0;color:#b89c6e;font-weight:600;}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.pgrid img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #eee;}
.pwrap{position:relative;}
.pdel{position:absolute;top:-5px;right:-5px;background:#c87070;border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;font-weight:700;cursor:pointer;}
.empty{text-align:center;padding:28px 20px;color:#ccc;}
.empty p{font-size:14px;font-style:italic;}
.divider{height:1px;background:#f0f0f0;margin:14px 0;}
.act-row{display:flex;gap:8px;margin-top:14px;}
.act-row .btn-primary{flex:1;}

/* Form */
.form-topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;}
.form-title{font-size:16px;font-weight:600;}
.ftabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #e5e5e5;position:sticky;top:49px;z-index:19;}
.ftabs::-webkit-scrollbar{height:0;}
.ftab{flex-shrink:0;padding:10px 13px;background:transparent;border:none;font-size:12px;color:#bbb;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;cursor:pointer;}
.ftab.on{color:#5b9ab5;font-weight:700;border-bottom-color:#5b9ab5;}
.form-body{padding:16px 16px 100px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:11px 12px;font-size:15px;color:#1a1a1a;outline:none;box-sizing:border-box;-webkit-appearance:none;}
.field textarea{line-height:1.6;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#5b9ab5;}
.field .hint{font-size:11px;margin-top:4px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.choices{display:flex;gap:8px;}
.choice{flex:1;padding:9px 6px;border:1.5px solid #eee;border-radius:8px;background:#fff;color:#999;font-size:12px;text-align:center;cursor:pointer;}
.choice.on{border-color:#5b9ab5;background:#eef5f8;color:#5b9ab5;font-weight:600;}
.check-row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;margin-bottom:14px;cursor:pointer;}
.check-row input[type=checkbox]{width:20px;height:20px;accent-color:#5b9ab5;flex-shrink:0;}
.check-row span{font-size:14px;color:#333;}
.inv-row{display:flex;gap:8px;}
.inv-choice{flex:1;padding:10px 8px;border:1.5px solid #eee;border-radius:8px;background:#fff;text-align:center;cursor:pointer;}
.inv-choice.on{border-color:#5b9ab5;background:#eef5f8;}
.inv-choice-lbl{font-size:13px;color:#1a1a1a;}
.inv-choice.on .inv-choice-lbl{color:#5b9ab5;font-weight:600;}
.inv-choice-sub{font-size:10px;color:#bbb;margin-top:2px;}
.coif-form-blk{background:#fff;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:12px;overflow:hidden;}
.coif-form-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:#f9f9f9;border-bottom:1px solid #eee;}
.coif-name-inp{border:none;background:transparent;font-size:15px;color:#1a1a1a;font-weight:600;outline:none;font-family:inherit;flex:1;min-width:0;}
.coif-form-body{padding:10px 13px;}
.client-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px 10px;background:#f9f9f9;border-radius:8px;}
.client-time{font-size:11px;font-weight:700;color:#5b9ab5;min-width:38px;flex-shrink:0;}
.client-inp{border:none;background:transparent;flex:1;outline:none;font-size:14px;font-family:inherit;color:#1a1a1a;min-width:0;}
.client-del{background:none;border:none;color:#c87070;font-size:18px;cursor:pointer;padding:0 2px;flex-shrink:0;}
.style-sel{width:100%;background:#fff;border:1px solid #eee;border-radius:6px;padding:7px 10px;font-size:12px;outline:none;margin-bottom:6px;color:#555;}
.orient-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.orient-btn{padding:4px 10px;border-radius:20px;border:1px solid #eee;background:#fff;font-size:11px;color:#999;cursor:pointer;}
.orient-btn.on{border-color:#b89c6e;background:#fdf8f0;color:#b89c6e;font-weight:600;}
.fin-box{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:11px 13px;margin-top:10px;}

/* Status colors */
.s-confirme{background:#8aab8c;}.s-complet{background:#c8a0a0;}.s-equipe1{background:#9b7fc4;}.s-equipe2{background:#c87090;}.s-equipe3{background:#5b9ab5;}.s-pending{background:#c8b89a;}
.b-confirme{background:#f0f7f0;color:#5a8a5a;border:1px solid #c0d8c0;}
.b-complet{background:#fff5f5;color:#c8a0a0;border:1px solid #f0d0d0;}
.b-equipe1{background:#f5f0fb;color:#7050a0;border:1px solid #d0b8f0;}
.b-equipe2{background:#fff0f5;color:#c05070;border:1px solid #f0b8c8;}
.b-equipe3{background:#eef5f8;color:#5b9ab5;border:1px solid #c2dcea;}
.b-pending{background:#fdf8f0;color:#b89060;border:1px solid #e8d8b0;}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;pointer-events:none;white-space:nowrap;max-width:90vw;}
</style>

<script>
// ═══════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════
const SUPA_URL = "https://ccnpfmlpbmtnygbprmif.supabase.co";
const SUPA_KEY = "sb_publishable_0oSish2LrU23kGRkXx-SiA_sAukjkIa";
const TABLE    = "weddings";

// ─── Supabase REST helpers ───────────────
async function supaFetch(method, path, body) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    method,
    headers: {
      "apikey":        SUPA_KEY,
      "Authorization": `Bearer ${SUPA_KEY}`,
      "Content-Type":  "application/json",
      "Prefer":        method === "POST" ? "resolution=merge-duplicates,return=minimal" : "return=minimal",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Supabase ${method} ${path}: ${res.status} — ${err}`);
  }
  if (method === "GET") return res.json();
  return null;
}

async function dbGetAll() {
  const rows = await supaFetch("GET", `${TABLE}?select=id,date,data`);
  return rows;
}

async function dbUpsertWedding(w) {
  await supaFetch("POST", TABLE, { id: w.id, date: w.date, data: w });
}

async function dbDeleteWedding(id) {
  await supaFetch("DELETE", `${TABLE}?id=eq.${encodeURIComponent(id)}`);
}

async function dbUpsertMeta(key, value) {
  await supaFetch("POST", TABLE, { id: `__meta_${key}`, date: "meta", data: { value } });
}

async function dbGetMeta(key) {
  const rows = await supaFetch("GET", `${TABLE}?id=eq.__meta_${encodeURIComponent(key)}&select=data`);
  if (rows && rows.length) return rows[0].data.value;
  return null;
}

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DAYS   = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const STYLES = ["Chignon haut","Chignon bas","French twist","Demi-attache","Tresses","Brushing","Queue de cheval"];
const ORIENTS= ["Classique chic","Structuré","Lisser","Plaquer","Bohème","Lâche","Flou"];
const SL     = {confirme:"Confirmé",complet:"Complet",equipe1:"Équipe 1",equipe2:"Équipe 2",equipe3:"Équipe 3",pending:"À confirmer"};
const SC     = {confirme:"#8aab8c",complet:"#c8a0a0",equipe1:"#9b7fc4",equipe2:"#c87090",equipe3:"#5b9ab5",pending:"#c8b89a"};
const TODAY  = new Date();
const CUR_YEAR = TODAY.getFullYear();
const YEARS  = Array.from({length: 7}, (_, i) => CUR_YEAR + i);

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let WEDDINGS     = [];   // array of wedding objects
let CLOSED_DATES = [];   // array of iso date strings
let CAL          = { year: CUR_YEAR, month: TODAY.getMonth() };
let SEL_DATE     = null;
let FORM         = null;
let FORM_TAB     = "info";
let EXP_CARD     = null;
let CARD_TAB     = {};

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function isoDate(y, m, d) { return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function isSat(iso) { return new Date(iso + "T12:00:00").getDay() === 6; }
function fmtDate(iso) {
  const [y, m, d] = iso.split("-");
  const dt = new Date(iso + "T12:00:00");
  const DN = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  return { day: parseInt(d), month: MONTHS[parseInt(m)-1], year: y, dayName: DN[dt.getDay()], sat: dt.getDay() === 6 };
}
function addMin(t, min) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number), tot = h*60 + m + min;
  return `${String(Math.floor(tot/60)%24).padStart(2,"0")}:${String(tot%60).padStart(2,"0")}`;
}
function emptyWedding(date) {
  return {
    id: uid(), date: date || isoDate(CUR_YEAR, TODAY.getMonth(), TODAY.getDate()),
    names: "", phone: "", email: "", publicationOk: null, status: "pending",
    location: "", arrivalTime: "", departureTime: "",
    forfait: "", nbInvites: "",
    payment: { forfait:"", km:"", prixKm:"1", acompteAmount:"", acompteDate:"", acompteReceived:false, invitesMode:"mariee" },
    vendors: { weddingPlanner:"", photographe:"", videaste:"", fleuriste:"", mua:"", robe:"", costume:"", autres:"" },
    coiffeuses: [],
    notesTab: { stylePresets:[], orientationPresets:[], voile:null, voilePose:"", accessoires:null, accessoiresList:[], heureMaquillage:"", photos:[], notes:"" },
    contrat: []
  };
}
function wByDate() {
  const m = {};
  WEDDINGS.forEach(w => { if (!m[w.date]) m[w.date] = []; m[w.date].push(w); });
  return m;
}
function showToast(msg) {
  let t = document.querySelector(".toast"); if (t) t.remove();
  t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function setSyncLabel(text, cls) {
  const e = document.getElementById("sync-lbl");
  if (!e) return;
  e.textContent = text;
  e.className = "sync " + (cls || "");
}
function showFormError(msg) {
  const e = document.getElementById("form-err");
  if (!e) return;
  if (msg) { e.textContent = msg; e.style.display = "block"; }
  else e.style.display = "none";
}

// ═══════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════
async function loadAll() {
  try {
    const rows = await dbGetAll();
    WEDDINGS = [];
    CLOSED_DATES = [];
    rows.forEach(row => {
      if (row.id.startsWith("__meta_closedDates")) {
        CLOSED_DATES = row.data.value || [];
      } else if (!row.id.startsWith("__meta_")) {
        // data field contains the full wedding object
        const w = typeof row.data === "object" ? row.data : JSON.parse(row.data);
        WEDDINGS.push(w);
      }
    });
    document.getElementById("loading-screen").style.display = "none";
    showPage("cal");
    buildCal();
    setSyncLabel("✓ Synchronisé", "ok");
  } catch (err) {
    console.error("Load error:", err);
    document.getElementById("loading-screen").style.display = "none";
    showPage("cal");
    buildCal();
    setSyncLabel("⚠ Hors ligne", "err");
    showToast("Erreur de connexion — vérifiez Supabase");
  }
}

// SAVE HELPERS

// ═══════════════════════════════════════════
// PAGE NAVIGATION
// ═══════════════════════════════════════════
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));

  if (p) { p.classList.add("active"); p.scrollTop = 0; }

// ═══════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════
function initNavSelects() {
  const ms = document.getElementById("sel-month");
  const ys = document.getElementById("sel-year");
  if (!ms.options.length) {
    MONTHS.forEach((m, i) => ms.appendChild(new Option(m, i)));
    YEARS.forEach(y => ys.appendChild(new Option(y, y)));
  }
  ms.value = String(CAL.month);
  ys.value = String(CAL.year);
}
function setMonth(v) { CAL.month = parseInt(v); buildCal(); }
function setYear(v)  { CAL.year  = parseInt(v); buildCal(); }
function prevMonth() {
  if (CAL.month === 0) { CAL.month = 11; CAL.year = Math.max(YEARS[0], CAL.year - 1); }
  else CAL.month--;
  buildCal();
}
function nextMonth() {
  if (CAL.month === 11) { CAL.month = 0; CAL.year = Math.min(YEARS[YEARS.length-1], CAL.year + 1); }
  else CAL.month++;
  buildCal();
}

function buildCal() {
  initNavSelects();
  // Day names
  const dn = document.getElementById("daynames"); dn.innerHTML = "";
  DAYS.forEach((d, i) => {
    const e = document.createElement("div"); e.className = "dayname" + (i === 5 ? " sat" : "");
    e.textContent = d; dn.appendChild(e);
  });

  const grid = document.getElementById("calgrid"); grid.innerHTML = "";
  const y = CAL.year, m = CAL.month;
  const first = new Date(y, m, 1);
  let off = first.getDay() - 1; if (off < 0) off = 6;
  const dim = new Date(y, m+1, 0).getDate();
  const prev = new Date(y, m, 0).getDate();
  const wbd = wByDate();

  const cells = [];
  for (let i = off-1; i >= 0; i--) cells.push({d: prev-i, mo: m-1, yo: y, other: true});
  for (let d = 1; d <= dim; d++) cells.push({d, mo: m, yo: y, other: false});
  while (cells.length % 7 !== 0) cells.push({d: cells.length - off - dim + 1, mo: m+1, yo: y, other: true});

  cells.forEach(c => {
    let nm = c.mo, ny = c.yo;
    if (nm < 0)  { nm = 11; ny--; }
    if (nm > 11) { nm = 0;  ny++; }
    const iso    = isoDate(ny, nm, c.d);
    const sat    = isSat(iso);
    const closed = CLOSED_DATES.includes(iso);
    const ws     = wbd[iso] || [];
    const todayCell = !c.other && TODAY.getFullYear() === ny && TODAY.getMonth() === nm && TODAY.getDate() === c.d;

    const cell = document.createElement("div");
    cell.className = "cell" + (c.other ? " other" : (sat ? " sat" : "") + (closed ? " closed" : ""));

    const num = document.createElement("div");
    if (todayCell) {
      num.className = "cell-num";
      const inner = document.createElement("div"); inner.className = "today";
      inner.textContent = c.d; num.appendChild(inner);
    } else {
      num.className = "cell-num" + (sat && !c.other ? " sat" : "");
      num.textContent = c.d;
    }
    cell.appendChild(num);

    if (!c.other) {
      const full = ws.some(w => w.status === "complet");
      if (full) {
        const fl = document.createElement("div"); fl.className = "cell-full"; fl.textContent = "Complet"; cell.appendChild(fl);
      } else if (ws.length) {
        const dots = document.createElement("div"); dots.className = "cell-dots";
        ws.forEach(w => { const dot = document.createElement("div"); dot.className = "cell-dot"; dot.style.background = SC[w.status] || "#ccc"; dots.appendChild(dot); });
        cell.appendChild(dots);
      }
      cell.addEventListener("click", () => openDay(iso));
    }
    grid.appendChild(cell);
  });
}

// ═══════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════
function doSearch(q) {
  document.getElementById("search-clear").style.display = q ? "" : "none";
  const box = document.getElementById("sres-box");
  if (!q || q.length < 2) { box.style.display = "none"; return; }
  const res = WEDDINGS.filter(w => [w.names, w.location, w.phone, w.email].some(f => (f || "").toLowerCase().includes(q.toLowerCase())));
  box.style.display = "block"; box.innerHTML = "";
  const hdr = document.createElement("div"); hdr.className = "sres-hdr";
  hdr.textContent = `${res.length} résultat${res.length !== 1 ? "s" : ""}`; box.appendChild(hdr);
  if (!res.length) { const e = document.createElement("div"); e.style.cssText = "color:#ccc;font-style:italic;font-size:13px;"; e.textContent = "Aucun résultat"; box.appendChild(e); return; }
  res.forEach(w => {
    const fd = fmtDate(w.date);
    const row = document.createElement("div"); row.className = "sres-row";
    row.innerHTML = `<div class="sres-name">${w.names || "Sans nom"}</div><div class="sres-sub">${fd.dayName} ${fd.day} ${fd.month} ${fd.year}${w.location ? " · " + w.location : ""}</div>`;
    row.addEventListener("click", () => {
      CAL.year = parseInt(w.date.split("-")[0]); CAL.month = parseInt(w.date.split("-")[1]) - 1;
      clearSearch(); openDay(w.date);
    });
    box.appendChild(row);
  });
}
function clearSearch() {
  document.getElementById("search-inp").value = "";
  document.getElementById("search-clear").style.display = "none";
  document.getElementById("sres-box").style.display = "none";
}

// DAY PAGE
// ═══════════════════════════════════════════
function openDay(iso) {
  SEL_DATE = iso;
  const fd = fmtDate(iso);
  document.getElementById("day-title").textContent = `${fd.dayName} ${fd.day} ${fd.month}`;
  buildDayPage();
  showPage("day");
}
function buildDayPage() {
  const iso = SEL_DATE;
  const body = document.getElementById("day-body"); body.innerHTML = "";
  const fd = fmtDate(iso);
  const ws = (wByDate()[iso] || []);
  const isClosed = CLOSED_DATES.includes(iso);

  if (!fd.sat) {
    const n = document.createElement("div"); n.className = "day-notice";
    n.textContent = "Ce jour n'est pas un samedi. Vous pouvez tout de même y ajouter un mariage.";
    body.appendChild(n);
  }

  // Closed toggle
  const cr = document.createElement("div"); cr.className = "closed-row";
  const cl = document.createElement("span"); cl.className = "closed-lbl"; cl.textContent = "Date fermée";
  const tb = document.createElement("button"); tb.className = isClosed ? "btn-primary" : "btn-secondary";
  tb.style.cssText = "padding:5px 14px;font-size:12px;"; tb.textContent = isClosed ? "Fermée" : "Ouverte";
  tb.addEventListener("click", async () => {
    CLOSED_DATES = isClosed ? CLOSED_DATES.filter(x => x !== iso) : [...CLOSED_DATES, iso];
    await persistClosedDates();
    buildDayPage(); buildCal();
  });
  cr.appendChild(cl); cr.appendChild(tb); body.appendChild(cr);

  if (!ws.length && !isClosed) {
    const em = document.createElement("div"); em.className = "empty";
    em.innerHTML = '<p>Aucun mariage — appuyez sur + Ajouter</p>'; body.appendChild(em);
  }
  ws.forEach(w => body.appendChild(buildWCard(w)));
}

// WEDDING CARD
// ═══════════════════════════════════════════
function buildWCard(w) {
  const cid = w.id, isExp = EXP_CARD === cid, itab = CARD_TAB[cid] || "details";
  const card = document.createElement("div"); card.className = "wcard";
  const stripe = document.createElement("div"); stripe.className = "wcard-stripe"; stripe.style.background = SC[w.status] || "#ccc"; card.appendChild(stripe);

  const hdr = document.createElement("div"); hdr.className = "wcard-hdr";
  const info = document.createElement("div"); info.style.cssText = "flex:1;min-width:0;";
  const nm = document.createElement("div"); nm.className = "wcard-name"; nm.textContent = w.names || "Sans nom"; info.appendChild(nm);
  const subs = [w.location, w.arrivalTime].filter(Boolean).join(" · ");
  if (subs) { const s = document.createElement("div"); s.className = "wcard-sub"; s.textContent = subs; info.appendChild(s); }
  hdr.appendChild(info);
  const right = document.createElement("div"); right.className = "wcard-right";
  const badge = document.createElement("span"); badge.className = `wbadge b-${w.status || "pending"}`; badge.textContent = SL[w.status] || w.status;
  const arr = document.createElement("span"); arr.className = "warr"; arr.textContent = isExp ? "▲" : "▼";
  right.appendChild(badge); right.appendChild(arr); hdr.appendChild(right);
  hdr.addEventListener("click", () => { EXP_CARD = isExp ? null : cid; buildDayPage(); });
  card.appendChild(hdr);
  if (!isExp) return card;

  const TABS = [["details","Détails"],["maps","Lieu"],["payment","Paiement"],["planning","Planning"],["notes","Notes"],["vendors","Prestataires"],["contrat","Contrat"]];
  const bar = document.createElement("div"); bar.className = "itabs";
  TABS.forEach(([tid, lbl]) => {
    const b = document.createElement("button"); b.className = "itab" + (itab === tid ? " on" : ""); b.textContent = lbl;
    b.addEventListener("click", () => { CARD_TAB[cid] = tid; buildDayPage(); }); bar.appendChild(b);
  });
  card.appendChild(bar);

  const body = document.createElement("div"); body.className = "tab-body";
  if (itab === "details")  body.appendChild(tabDetails(w));
  if (itab === "maps")     body.appendChild(tabMaps(w));
  if (itab === "payment")  body.appendChild(tabPayment(w));
  if (itab === "planning") body.appendChild(tabPlanning(w));
  if (itab === "notes")    body.appendChild(tabNotes(w));
  if (itab === "vendors")  body.appendChild(tabVendors(w));
  if (itab === "contrat")  body.appendChild(tabContrat(w));
  card.appendChild(body);
  return card;
}

function mkDiv(cls, txt, style) { const d = document.createElement("div"); if (cls) d.className = cls; if (txt !== undefined) d.textContent = txt; if (style) Object.assign(d.style, style); return d; }
function mkDivider() { return mkDiv("divider"); }
function mkInfoBlock(rows) {
  const ib = mkDiv("info-block");
  rows.forEach(([l, v]) => {
    const row = mkDiv("info-row");
    row.appendChild(mkDiv("info-lbl", l));
    const val = mkDiv("info-val" + ((!v || v === "—") ? " em" : ""), v || "—");
    row.appendChild(val); ib.appendChild(row);
  });
  return ib;
}

function tabDetails(w) {
  const b = mkDiv("");
  b.appendChild(mkDiv("sect-title", "Contact"));
  if (w.phone) { const a = document.createElement("a"); a.href = `tel:${w.phone}`; a.className = "clink"; a.innerHTML = `<span class="clink-lbl">Tél</span><span class="clink-val">${w.phone}</span>`; b.appendChild(a); }
  if (w.email) { const a = document.createElement("a"); a.href = `mailto:${w.email}`; a.className = "clink"; a.innerHTML = `<span class="clink-lbl">Email</span><span class="clink-val">${w.email}</span>`; b.appendChild(a); }
  if (!w.phone && !w.email) b.appendChild(mkDiv("", "Aucun contact renseigné", {color:"#ccc",fontStyle:"italic",fontSize:"13px",marginBottom:"10px"}));
  b.appendChild(mkDivider());
  b.appendChild(mkInfoBlock([
    ["Statut",SL[w.status]||w.status],
    ["Forfait",w.forfait||"—"],
    ["Nb invités à coiffer",w.nbInvites||"—"],
    ["Arrivée",w.arrivalTime||"—"],
    ["Départ",w.departureTime||"—"],
    ["Publication",w.publicationOk===true?"Autorisée":w.publicationOk===false?"Refusée":"Non répondu"]
  ]));
  b.appendChild(mkDivider());
  const acts = mkDiv("act-row");
  const be = document.createElement("button"); be.className = "btn-primary"; be.textContent = "Modifier"; be.addEventListener("click", () => openEditWedding(w));
  const bd = document.createElement("button"); bd.className = "btn-danger"; bd.textContent = "Supprimer";
  bd.addEventListener("click", async () => {
    if (!confirm(`Supprimer "${w.names}" ?`)) return;
    WEDDINGS = WEDDINGS.filter(x => x.id !== w.id);
    await deleteWedding(w.id);
    buildDayPage(); buildCal(); showToast("Supprimé");
  });
  acts.appendChild(be); acts.appendChild(bd); b.appendChild(acts);
  return b;
}

function tabMaps(w) {
  const b = mkDiv("");
  if (!w.location) { b.appendChild(mkDiv("empty", "", {})); b.querySelector(".empty").innerHTML = "<p>Aucun lieu renseigné</p>"; return b; }
  b.appendChild(mkInfoBlock([["Lieu", w.location]]));
  const mr = mkDiv("map-row");
  const a1 = document.createElement("a"); a1.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(w.location)}`; a1.target = "_blank"; a1.className = "mapbtn blue"; a1.textContent = "Voir sur Maps";
  const a2 = document.createElement("a"); a2.href = `https://waze.com/ul?q=${encodeURIComponent(w.location)}&navigate=yes`; a2.target = "_blank"; a2.className = "mapbtn grn"; a2.textContent = "Waze";
  mr.appendChild(a1); mr.appendChild(a2); b.appendChild(mr);
  return b;
}

function tabPayment(w) {
  const pay = w.payment || {};
  const f = parseFloat(pay.forfait)||0, km = parseFloat(pay.km)||0, pk = parseFloat(pay.prixKm)||1;
  const frais = km*pk, total = f+frais, ac = parseFloat(pay.acompteAmount)||0, reste = Math.max(0, total-ac);
  const b = mkDiv("");
  const tc = mkDiv("pay-total"); tc.innerHTML = `<div class="pay-total-lbl">Total à payer</div><div class="pay-total-val">${total > 0 ? total.toFixed(2)+" €" : "—"}</div>`;
  if (frais > 0) tc.appendChild(mkDiv("", `Forfait ${f.toFixed(2)} € + Frais km ${frais.toFixed(2)} €`, {fontSize:"11px",color:"rgba(255,255,255,.4)",marginTop:"4px"}));
  if (ac > 0) { const ts = mkDiv("pay-total-sub"); const col = reste===0?"#7fd87f":"#ffcc70"; ts.innerHTML = `Acompte : ${ac.toFixed(2)} € → <span style="color:${col};font-weight:600">${reste===0?"Soldé":"Reste "+reste.toFixed(2)+" €"}</span>`; tc.appendChild(ts); }
  b.appendChild(tc);
  b.appendChild(mkInfoBlock([["Forfait",pay.forfait?pay.forfait+" €":"—"],["Kilomètres",pay.km?pay.km+" km":"—"],["Prix / km",(pay.prixKm||"1")+" €/km"],...(frais>0?[["Frais km",frais.toFixed(2)+" €"]]:[]),["Acompte",pay.acompteAmount?pay.acompteAmount+" €":"—"],["Acompte reçu",pay.acompteReceived?"Oui":"Non"],["Règlement invités",pay.invitesMode==="mariee"?"Par la mariée":"Individuel"]]));
  const eb = document.createElement("button"); eb.className = "btn-secondary"; eb.style.cssText = "width:100%;margin-top:4px;"; eb.textContent = "Modifier le paiement"; eb.addEventListener("click", () => openEditWedding(w, "payment")); b.appendChild(eb);
  return b;
}

function tabPlanning(w) {
  const b = mkDiv("");
  b.appendChild(mkInfoBlock([["Arrivée", w.arrivalTime||"—"],["Départ cérémonie", w.departureTime||"—"]]));
  const coifs = w.coiffeuses || [];
  if (!coifs.length) { b.appendChild(mkDiv("empty", "", {})); b.querySelector(".empty").innerHTML = "<p>Aucun planning</p>"; }
  else coifs.forEach((cf, ci) => {
    const blk = mkDiv("coif-blk");
    const bh = mkDiv("coif-blk-hdr");
    const dot = document.createElement("span"); dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:${["#5b9ab5","#a08abf","#8aab8c","#c8a0a0"][ci]||"#ccc"};`;
    const nm = mkDiv("coif-blk-name", cf.name || `Coiffeuse ${ci+1}`);
    const cnt = mkDiv("coif-blk-cnt", `${(cf.clients||[]).length} cliente${(cf.clients||[]).length!==1?"s":""}`);
    const hn = mkDiv("", ""); hn.style.cssText = "display:flex;align-items:center;"; hn.appendChild(dot); hn.appendChild(nm);
    bh.appendChild(hn); bh.appendChild(cnt); blk.appendChild(bh);
    if ((cf.clients||[]).length) {
      const bb = mkDiv("coif-blk-body");
      cf.clients.forEach((cl, idx) => {
        const dur = parseInt(cl.duration) || 45;
        const st  = cl.startTime || addMin(w.arrivalTime||"08:00", idx*45);
        const en  = addMin(st, dur);
        const row = mkDiv("slot-row");
        const time = mkDiv("slot-time", `${st} → ${en}`);
        const iinfo = mkDiv(""); iinfo.appendChild(mkDiv("slot-name", cl.person||"—"));
        if (cl.style || cl.orientation) {
          const tags = mkDiv("slot-tags");
          if (cl.style) { const t = mkDiv("stag sky", cl.style); tags.appendChild(t); }
          if (cl.orientation) { const t = mkDiv("stag gld", cl.orientation); tags.appendChild(t); }
          iinfo.appendChild(tags);
        }
        row.appendChild(time); row.appendChild(iinfo); bb.appendChild(row);
      });
      const last = cf.clients.length;
      bb.appendChild(mkDiv("", `Fin : ${addMin(addMin(w.arrivalTime||"08:00",(last-1)*45),45)}`, {fontSize:"11px",color:"#bbb",textAlign:"right",paddingTop:"4px"}));
      blk.appendChild(bb);
    }
    b.appendChild(blk);
  });
  const eb = document.createElement("button"); eb.className = "btn-secondary"; eb.style.cssText = "width:100%;margin-top:8px;"; eb.textContent = "Modifier le planning"; eb.addEventListener("click", () => openEditWedding(w, "planning")); b.appendChild(eb);
  return b;
}

function tabNotes(w) {
  const nt = w.notesTab || {}; const b = mkDiv("");
  const hasContent = (nt.stylePresets||[]).length || (nt.orientationPresets||[]).length || (nt.photos||[]).length || nt.notes || nt.voile !== null && nt.voile !== undefined || nt.accessoires !== null && nt.accessoires !== undefined || nt.heureMaquillage;

  if ((nt.stylePresets||[]).length || (nt.orientationPresets||[]).length) {
    b.appendChild(mkDiv("sect-title", "Style retenu"));
    const tr = mkDiv("tag-row");
    (nt.stylePresets||[]).forEach(s => { const t = mkDiv("stag sky", s); tr.appendChild(t); });
    (nt.orientationPresets||[]).forEach(s => { const t = mkDiv("stag gld", s); tr.appendChild(t); });
    b.appendChild(tr); b.appendChild(mkDivider());
  }

  // Voile, Accessoires, Maquillage
  const rows = [];
  if (nt.voile === true)  rows.push(["Voile", nt.voilePose === "dessus" ? "Oui — dessus la coiffure" : nt.voilePose === "dessous" ? "Oui — dessous la coiffure" : "Oui"]);
  if (nt.voile === false) rows.push(["Voile", "Non"]);
  if (nt.accessoires === true) rows.push(["Accessoires", (nt.accessoiresList||[]).join(", ") || "Oui"]);
  if (nt.accessoires === false) rows.push(["Accessoires", "Non"]);
  if (nt.heureMaquillage) rows.push(["Maquillage", nt.heureMaquillage]);
  if (rows.length) { b.appendChild(mkInfoBlock(rows)); b.appendChild(mkDivider()); }

  if ((nt.photos||[]).length) {
    b.appendChild(mkDiv("sect-title", "Photos essai"));
    const grid = mkDiv("pgrid");
    (nt.photos||[]).forEach(p => { const img = document.createElement("img"); img.src = p; img.alt = ""; grid.appendChild(img); });
    b.appendChild(grid); b.appendChild(mkDivider());
  }
  if (nt.notes) { b.appendChild(mkDiv("sect-title", "Notes")); b.appendChild(mkDiv("", nt.notes, {fontSize:"14px",color:"#333",lineHeight:"1.65",whiteSpace:"pre-wrap"})); b.appendChild(mkDivider()); }
  if (!hasContent) { b.appendChild(mkDiv("empty", "", {})); b.querySelector(".empty").innerHTML = "<p>Aucune note</p>"; }
  const eb = document.createElement("button"); eb.className = "btn-secondary"; eb.style.width = "100%"; eb.textContent = "Modifier les notes"; eb.addEventListener("click", () => openEditWedding(w, "notes")); b.appendChild(eb);
  return b;
}

function tabContrat(w) {
  const contrat = w.contrat || []; const b = mkDiv("");
  b.appendChild(mkDiv("sect-title", "Contrat signé"));
  if (!contrat.length) {
    const em = mkDiv("empty"); em.innerHTML = "<p>Aucun contrat importé</p><small>Modifiez pour ajouter une photo ou un PDF</small>"; b.appendChild(em);
  } else {
    const grid = mkDiv("pgrid");
    contrat.forEach((item, i) => {
      if (item.type === "image") {
        const img = document.createElement("img"); img.src = item.data; img.alt = `Contrat ${i+1}`;
        img.style.cssText = "width:100%;height:auto;border-radius:8px;border:1px solid #eee;margin-bottom:8px;cursor:pointer;";
        img.addEventListener("click", () => window.open(item.data, "_blank"));
        b.appendChild(img);
      } else if (item.type === "pdf") {
        const link = document.createElement("a"); link.href = item.data; link.download = `contrat_${w.names||"mariage"}.pdf`; link.target = "_blank";
        link.className = "btn-secondary"; link.style.cssText = "display:block;width:100%;text-align:center;text-decoration:none;margin-bottom:8px;padding:12px;box-sizing:border-box;";
        link.textContent = `📄 Contrat ${i+1} — Ouvrir / Télécharger`;
        b.appendChild(link);
      }
    });
    b.appendChild(grid);
  }
  // Export PDF fiche
  const expBtn = document.createElement("button"); expBtn.className = "btn-primary"; expBtn.style.cssText = "width:100%;margin-top:12px;";
  expBtn.textContent = "Exporter la fiche en PDF";
  expBtn.addEventListener("click", () => exportPDF(w));
  b.appendChild(expBtn);
  const editBtn = document.createElement("button"); editBtn.className = "btn-secondary"; editBtn.style.cssText = "width:100%;margin-top:8px;";
  editBtn.textContent = "Modifier le contrat"; editBtn.addEventListener("click", () => openEditWedding(w, "contrat")); b.appendChild(editBtn);
  return b;
}

// ─── Export PDF ─────────────────────────────────────────
function exportPDF(w) {
  const pay = w.payment || {};
  const f = parseFloat(pay.forfait)||0, km = parseFloat(pay.km)||0, pk = parseFloat(pay.prixKm)||1;
  const fraisKm = km*pk, total = f+fraisKm, ac = parseFloat(pay.acompteAmount)||0, reste = Math.max(0, total-ac);
  const nt = w.notesTab || {};
  const fd = w.date ? fmtDate(w.date) : null;
  const dateStr = fd ? (fd.dayName + " " + fd.day + " " + fd.month + " " + fd.year) : "—";

  const coifLines = (w.coiffeuses||[]).map(function(cf) {
    const clientLines = (cf.clients||[]).map(function(cl, i) {
      const st = cl.startTime || addMin(w.arrivalTime||"08:00", i*45);
      const en = addMin(st, parseInt(cl.duration)||45);
      return st + "→" + en + " — " + (cl.person||"—") + (cl.style ? " (" + cl.style + ")" : "");
    }).join("<br>");
    return "<b>" + (cf.name||"Coiffeuse") + "</b><br>" + clientLines;
  }).join("<br><br>");

  const styleTagsHTML = (nt.stylePresets||[]).map(function(s){ return '<span class="tag">' + s + '</span>'; }).join("") +
    (nt.orientationPresets||[]).map(function(s){ return '<span class="tag" style="background:#fdf8f0;color:#b89c6e;">' + s + '</span>'; }).join("");

  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"/>';
  html += '<style>';
  html += 'body{font-family:Georgia,serif;color:#1a1a1a;padding:30px;max-width:700px;margin:0 auto;}';
  html += 'h1{font-size:22px;font-weight:700;margin-bottom:4px;}';
  html += 'h2{font-size:14px;color:#5b9ab5;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px;border-bottom:1px solid #eee;padding-bottom:4px;}';
  html += '.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}';
  html += '.lbl{color:#999;}.val{font-weight:500;text-align:right;}';
  html += '.total{background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:8px;margin:10px 0;}';
  html += '.total-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;}';
  html += '.total-val{font-size:28px;font-weight:300;}';
  html += '.tag{display:inline-block;background:#eef5f8;color:#5b9ab5;padding:3px 10px;border-radius:20px;font-size:11px;margin:2px;}';
  html += '@media print{body{padding:10px;}}';
  html += '</style></head><body>';
  html += '<h1>' + (w.names||"Sans nom") + '</h1>';
  html += '<p style="color:#999;font-size:12px;">' + dateStr + '</p>';
  html += '<h2>Informations</h2>';
  html += '<div class="row"><span class="lbl">Statut</span><span class="val">' + (SL[w.status]||w.status) + '</span></div>';
  html += '<div class="row"><span class="lbl">Forfait</span><span class="val">' + (w.forfait||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Invités à coiffer</span><span class="val">' + (w.nbInvites||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Lieu</span><span class="val">' + (w.location||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Arrivée</span><span class="val">' + (w.arrivalTime||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Départ</span><span class="val">' + (w.departureTime||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Téléphone</span><span class="val">' + (w.phone||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Email</span><span class="val">' + (w.email||"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Publication</span><span class="val">' + (w.publicationOk===true?"Autorisée":w.publicationOk===false?"Refusée":"—") + '</span></div>';
  html += '<h2>Paiement</h2>';
  html += '<div class="total"><div class="total-lbl">Total à payer</div><div class="total-val">' + (total>0?total.toFixed(2)+" €":"—") + '</div></div>';
  html += '<div class="row"><span class="lbl">Forfait</span><span class="val">' + (pay.forfait?pay.forfait+" €":"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Frais km</span><span class="val">' + (fraisKm>0?fraisKm.toFixed(2)+" €":"—") + '</span></div>';
  html += '<div class="row"><span class="lbl">Acompte versé</span><span class="val">' + (pay.acompteAmount?pay.acompteAmount+" €":"—") + '</span></div>';
  const resteColor = reste===0 ? "#5a8a5a" : "#c04040";
  html += '<div class="row"><span class="lbl">Reste à payer</span><span class="val" style="color:' + resteColor + ';font-weight:700;">' + (reste===0?"Soldé ✓":reste.toFixed(2)+" €") + '</span></div>';
  html += '<div class="row"><span class="lbl">Règlement invités</span><span class="val">' + (pay.invitesMode==="mariee"?"Par la mariée":"Individuel") + '</span></div>';
  if (coifLines) html += '<h2>Planning coiffage</h2><p style="font-size:13px;line-height:1.8;">' + coifLines + '</p>';
  if (styleTagsHTML) html += '<h2>Style retenu</h2><div>' + styleTagsHTML + '</div>';
  if (nt.notes) html += '<h2>Notes</h2><p style="font-size:13px;line-height:1.65;white-space:pre-wrap;">' + nt.notes + '</p>';
  html += '</body></html>';

async function saveWedding() {
  showFormError(null);
  // Flush any focused input on iPhone
  if (document.activeElement) document.activeElement.blur();
  await new Promise(r => setTimeout(r, 80)); // wait for blur events

  if (!FORM.names || !FORM.names.trim()) {
    showFormError("Veuillez saisir un nom pour les mariés.");
    return;
  }

  const existing = WEDDINGS.find(x => x.id === FORM.id);
  const saved = JSON.parse(JSON.stringify(FORM));
  try {
    if (existing) WEDDINGS = WEDDINGS.map(x => x.id === saved.id ? saved : x);
    else WEDDINGS.push(saved);
    await persistWedding(saved);
    if (saved.date) { CAL.year = parseInt(saved.date.split("-")[0]); CAL.month = parseInt(saved.date.split("-")[1]) - 1; }
    SEL_DATE = saved.date;
    buildCal();
    buildDayPage();
    showPage("day");
    showToast(existing ? "Mis à jour ✓" : "Mariage ajouté ✓");
  } catch(err) {
    showFormError("Erreur lors de la sauvegarde. Vérifiez votre connexion et réessayez.");
  }
}

function renderClients(container, ci) {
  container.innerHTML = "";

  // ── Recalcul en cascade ──────────────────────────────────────────────────
  // Chaque cliente : startTime = fin de la précédente (ou arrivalTime pour la 1ère)
  // On recalcule proprement AVANT de render
  const clients = FORM.coiffeuses[ci].clients || [];
  clients.forEach((cl, idx) => {
    const dur = parseInt(cl.duration) || 45;
    if (idx === 0) {
      // 1ère cliente : si pas de startTime forcé, utilise arrivalTime
      if (!cl.startTime) cl.startTime = FORM.arrivalTime || "08:00";
    } else {
      // Clientes suivantes : startTime = fin de la précédente, SAUF si manuellement modifié
      // On recalcule à partir de la précédente uniquement si le flag cascade est actif
      if (cl._cascade !== false) {
        const prev = clients[idx - 1];
        const prevDur = parseInt(prev.duration) || 45;
        cl.startTime = addMin(prev.startTime || FORM.arrivalTime || "08:00", prevDur);
      }
    }
  });

  clients.forEach((cl, clidx) => {
    const dur = parseInt(cl.duration) || 45;
    const start = cl.startTime || FORM.arrivalTime || "08:00";
    const end   = addMin(start, dur);

    const row = mkDiv("client-row");

    // Heure éditable — quand modifiée, désactive la cascade pour cette cliente
    const tInp = document.createElement("input");
    tInp.type = "time"; tInp.value = start;
    tInp.style.cssText = "border:none;background:transparent;font-size:11px;font-weight:700;color:#5b9ab5;width:54px;outline:none;font-family:inherit;padding:0;";
    tInp.addEventListener("change", e => {
      FORM.coiffeuses[ci].clients[clidx].startTime = e.target.value;
      FORM.coiffeuses[ci].clients[clidx]._cascade = false; // heure forcée manuellement
      // Recascade les suivantes
      recascadeFrom(ci, clidx + 1);
      renderClients(container, ci);
      updateFinBox();
    });

    // Durée éditable — recascade les suivantes
    const dInp = document.createElement("input");
    dInp.type = "number"; dInp.value = dur; dInp.min = "5";
    dInp.style.cssText = "border:none;background:#eef5f8;border-radius:4px;font-size:10px;color:#5b9ab5;width:34px;text-align:center;outline:none;padding:2px 3px;font-family:sans-serif;";
    dInp.title = "Durée en minutes";
    dInp.addEventListener("change", e => {
      FORM.coiffeuses[ci].clients[clidx].duration = parseInt(e.target.value) || 45;
      // Recascade toutes les suivantes
      recascadeFrom(ci, clidx + 1);
      renderClients(container, ci);
      updateFinBox();
    });
    dInp.addEventListener("input", e => {
      FORM.coiffeuses[ci].clients[clidx].duration = parseInt(e.target.value) || 45;
    });

    const durLbl = mkDiv("", "min", {fontSize:"10px",color:"#bbb",fontFamily:"sans-serif",flexShrink:"0"});

    // Affichage heure de fin
    const endLbl = mkDiv("", `→ ${end}`, {fontSize:"10px",color:"#aaa",fontFamily:"sans-serif",flexShrink:"0",whiteSpace:"nowrap"});

    // Prénom
    const ni = document.createElement("input"); ni.className = "client-inp"; ni.type = "text"; ni.value = cl.person || ""; ni.placeholder = "Prénom";
    ni.addEventListener("input",  e => FORM.coiffeuses[ci].clients[clidx].person = e.target.value);
    ni.addEventListener("change", e => FORM.coiffeuses[ci].clients[clidx].person = e.target.value);

    // Supprimer
    const dc = document.createElement("button"); dc.className = "client-del"; dc.textContent = "×";
    dc.addEventListener("click", () => {
      FORM.coiffeuses[ci].clients.splice(clidx, 1);
      recascadeFrom(ci, clidx);
      renderClients(container, ci);
      updateFinBox();
    });

    row.appendChild(tInp); row.appendChild(dInp); row.appendChild(durLbl);
    row.appendChild(endLbl); row.appendChild(ni); row.appendChild(dc);
    container.appendChild(row);

    // Style uniquement
    const ss = document.createElement("select"); ss.className = "style-sel";
    [["","Style…"], ...STYLES.map(s => [s, s])].forEach(([v, l]) => {
      const o = new Option(l, v); if ((cl.style||"") === v) o.selected = true; ss.appendChild(o);
    });
    ss.addEventListener("change", e => FORM.coiffeuses[ci].clients[clidx].style = e.target.value);
    container.appendChild(ss);
  });
}

// Recalcule les startTime en cascade à partir de l'index donné
function recascadeFrom(ci, fromIdx) {
  const clients = FORM.coiffeuses[ci].clients || [];
  for (let i = fromIdx; i < clients.length; i++) {
    const prev = clients[i - 1];
    if (!prev) break;
    const prevDur = parseInt(prev.duration) || 45;
    clients[i].startTime = addMin(prev.startTime || FORM.arrivalTime || "08:00", prevDur);
    clients[i]._cascade = true;
  }
}
function updateFinBox() {
  const box = document.getElementById("fin-box"); if (!box) return; box.innerHTML = "";
  // Trouve la fin la plus tardive parmi toutes les coiffeuses
  let latestEnd = "";
  (FORM.coiffeuses || []).forEach(cf => {
    (cf.clients || []).forEach(cl => {
      const dur = parseInt(cl.duration) || 45;
      const end = addMin(cl.startTime || FORM.arrivalTime || "08:00", dur);
      if (!latestEnd || end > latestEnd) latestEnd = end;
    });
  });
  if (latestEnd) {
    box.className = "fin-box";
    box.appendChild(mkDiv("sect-title", "Fin estimée des coiffages", {marginBottom:"4px"}));
    box.appendChild(mkDiv("", latestEnd, {fontSize:"18px",fontWeight:"700",color:"#333"}));
  }
}

  [{val:true,lbl:"Oui"},{val:false,lbl:"Non"}].forEach(opt => {
    const isOn = nt.accessoires === opt.val;
    const btn = document.createElement("button"); btn.className = "choice" + (isOn ? " on" : ""); btn.textContent = opt.lbl;
    btn.addEventListener("click", () => { FORM.notesTab.accessoires = opt.val; buildFormBody(); });
    acrow.appendChild(btn);
  });
  acf.appendChild(acrow);
  if (nt.accessoires === true) {
    const acopts = ["Fleurs","Broches","Épingles","Couronne","Autres"];
    const aclist = mkDiv("tag-row"); aclist.style.marginTop = "8px";
    acopts.forEach(opt => {
      const isOn = (nt.accessoiresList||[]).includes(opt);
      const t = document.createElement("button"); t.className = "tag" + (isOn ? " sky" : ""); t.textContent = opt;
      t.addEventListener("click", () => {
        const cur = FORM.notesTab.accessoiresList || [];
        FORM.notesTab.accessoiresList = isOn ? cur.filter(x => x !== opt) : [...cur, opt];
        t.className = "tag" + (FORM.notesTab.accessoiresList.includes(opt) ? " sky" : "");
      });
      aclist.appendChild(t);
    });
    acf.appendChild(aclist);
  }
  b.appendChild(acf);

  // ── Heure maquillage
  const hf = mkDiv("field"); hf.appendChild(fLabel("Heure de maquillage"));
  const hi = document.createElement("input"); hi.type = "time"; hi.value = nt.heureMaquillage || "";
  hi.addEventListener("change", e => FORM.notesTab.heureMaquillage = e.target.value);
  hi.addEventListener("input",  e => FORM.notesTab.heureMaquillage = e.target.value);
  hf.appendChild(hi); b.appendChild(hf);

  // ── Photos essai
  const pf = mkDiv("field"); pf.appendChild(fLabel("Photos de l'essai"));
  const fr = document.createElement("input"); fr.type = "file"; fr.accept = "image/*"; fr.style.display = "none";
  fr.addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = ev => { if (!FORM.notesTab.photos) FORM.notesTab.photos = []; FORM.notesTab.photos.push(ev.target.result); buildFormBody(); }; r.readAsDataURL(f);
  });
  pf.appendChild(fr);
  const fpb = document.createElement("button"); fpb.className = "btn-secondary"; fpb.style.width = "100%"; fpb.textContent = "Ajouter une photo"; fpb.addEventListener("click", () => fr.click()); pf.appendChild(fpb);
  if ((nt.photos||[]).length) {
    const grid = mkDiv("pgrid"); grid.style.marginTop = "8px";
    (nt.photos||[]).forEach((p, i) => {
      const wrap = mkDiv("pwrap"); const img = document.createElement("img"); img.src = p; img.alt = "";
      const del = document.createElement("button"); del.className = "pdel"; del.textContent = "×";
      del.addEventListener("click", () => { FORM.notesTab.photos.splice(i, 1); buildFormBody(); });
      wrap.appendChild(img); wrap.appendChild(del); grid.appendChild(wrap);
    });
    pf.appendChild(grid);
  }
  b.appendChild(pf);

  // ── Notes libres
  const nf = mkDiv("field"); nf.appendChild(fLabel("Notes libres"));
  const ta = document.createElement("textarea"); ta.rows = 7; ta.placeholder = "Observations, souhaits, remarques…"; ta.value = nt.notes || "";
  ta.addEventListener("input",  e => FORM.notesTab.notes = e.target.value);
  ta.addEventListener("change", e => FORM.notesTab.notes = e.target.value);
  nf.appendChild(ta); b.appendChild(nf);
  return b;
}

// ─── VENDORS TAB ─────────────────────────────────────────
function buildFVendors() {
  if (!FORM.vendors) FORM.vendors = {};
  const v = FORM.vendors; const b = mkDiv("");
  [["weddingPlanner","Wedding Planner"],["photographe","Photographe"],["videaste","Vidéaste"],["fleuriste","Fleuriste"],["mua","MUA"],["robe","Robe"],["costume","Costume"],["autres","Autres"]].forEach(([k, l]) => {
    const f = mkDiv("field"); f.appendChild(fLabel(l));
    const ta = document.createElement("textarea"); ta.rows = 2; ta.placeholder = "Nom, tél, email…"; ta.value = v[k] || "";
    ta.addEventListener("input",  e => FORM.vendors[k] = e.target.value);
    ta.addEventListener("change", e => FORM.vendors[k] = e.target.value);
    f.appendChild(ta); b.appendChild(f);
  });
  return b;
}

// ─── Field helpers ────────────────────────────────────────
function buildFContrat() {
  if (!FORM.contrat) FORM.contrat = [];
  const b = mkDiv("");
  b.appendChild(mkDiv("sect-title", "Importer le contrat signé"));
  b.appendChild(mkDiv("", "Vous pouvez importer une photo ou un PDF du contrat signé.", {fontSize:"12px",color:"#bbb",marginBottom:"14px",lineHeight:"1.5"}));

  // Import photo
  const frImg = document.createElement("input"); frImg.type = "file"; frImg.accept = "image/*"; frImg.style.display = "none";
  frImg.addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = ev => { FORM.contrat.push({type:"image",data:ev.target.result,name:f.name}); buildFormBody(); }; r.readAsDataURL(f);
  });
  b.appendChild(frImg);
  const btnImg = document.createElement("button"); btnImg.className = "btn-secondary"; btnImg.style.cssText = "width:100%;margin-bottom:10px;"; btnImg.textContent = "Importer une photo du contrat";
  btnImg.addEventListener("click", () => frImg.click()); b.appendChild(btnImg);

  // Import PDF
  const frPdf = document.createElement("input"); frPdf.type = "file"; frPdf.accept = "application/pdf"; frPdf.style.display = "none";
  frPdf.addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = ev => { FORM.contrat.push({type:"pdf",data:ev.target.result,name:f.name}); buildFormBody(); }; r.readAsDataURL(f);
  });
  b.appendChild(frPdf);
  const btnPdf = document.createElement("button"); btnPdf.className = "btn-secondary"; btnPdf.style.cssText = "width:100%;margin-bottom:16px;"; btnPdf.textContent = "Importer un PDF du contrat";
  btnPdf.addEventListener("click", () => frPdf.click()); b.appendChild(btnPdf);

  // Liste des fichiers importés
  if (FORM.contrat.length) {
    b.appendChild(mkDiv("sect-title", "Fichiers importés"));
    FORM.contrat.forEach((item, i) => {
      const row = mkDiv("", "", {display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 13px",background:"#f9f9f9",borderRadius:"8px",border:"1px solid #eee",marginBottom:"8px"});
      const lbl = mkDiv("", item.type === "pdf" ? `📄 ${item.name||"Contrat PDF"}` : `🖼 ${item.name||"Photo contrat"}`, {fontSize:"13px",color:"#333",flex:"1",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"});
      const del = document.createElement("button"); del.className = "btn-danger"; del.style.cssText = "padding:4px 10px;font-size:12px;flex-shrink:0;margin-left:8px;"; del.textContent = "Retirer";
      del.addEventListener("click", () => { FORM.contrat.splice(i, 1); buildFormBody(); });
      row.appendChild(lbl); row.appendChild(del); b.appendChild(row);
    });
  }

  // Bouton export PDF fiche
  b.appendChild(mkDiv("divider"));
  const expBtn = document.createElement("button"); expBtn.className = "btn-primary"; expBtn.style.width = "100%";
  expBtn.textContent = "Exporter la fiche complète en PDF";
  expBtn.addEventListener("click", () => exportPDF(FORM));
  b.appendChild(expBtn);
  return b;
}

function fLabel(txt) { const l = document.createElement("label"); l.textContent = txt; return l; }
function fText(label, key, placeholder, type) {
  const f = mkDiv("field"); f.appendChild(fLabel(label));
  const i = document.createElement("input"); i.type = type || "text"; i.value = FORM[key] || ""; i.placeholder = placeholder || "";
  i.addEventListener("input",  e => FORM[key] = e.target.value);
  i.addEventListener("change", e => FORM[key] = e.target.value);
  f.appendChild(i); return f;
}
function fTime(label, key) {
  const f = mkDiv("field"); f.appendChild(fLabel(label));
  const i = document.createElement("input"); i.type = "time"; i.value = FORM[key] || "";
  i.addEventListener("change", e => FORM[key] = e.target.value);
  i.addEventListener("input",  e => FORM[key] = e.target.value);
  f.appendChild(i); return f;
}
function fNum(label, key, sub, placeholder) {
  const f = mkDiv("field"); f.appendChild(fLabel(label));
  const target = sub === "pay" ? FORM.payment : FORM;
  const i = document.createElement("input"); i.type = "number"; i.inputMode = "decimal"; i.value = target[key] || ""; i.placeholder = placeholder || "";
  i.addEventListener("input",  e => { target[key] = e.target.value; if (sub === "pay") renderPayCard(); });
  i.addEventListener("change", e => { target[key] = e.target.value; if (sub === "pay") renderPayCard(); });
  f.appendChild(i); return f;
}

// ⚠️ Changez ce mot de passe — partagez-le uniquement avec votre équipe
const APP_PASSWORD = "LM2027";
const AUTH_KEY     = "lm-auth-ok";

function checkPwd() {
  const input = document.getElementById("pwd-input").value;
  if (input === APP_PASSWORD) {
    sessionStorage.setItem(AUTH_KEY, "1");
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("loading-screen").style.display = "flex";
    loadAll();
  } else {
    const err = document.getElementById("login-err");
    err.style.display = "block";
    document.getElementById("pwd-input").value = "";
    document.getElementById("pwd-input").focus();
    setTimeout(() => err.style.display = "none", 2500);
  }
}

function initAuth() {
  if (sessionStorage.getItem(AUTH_KEY) === "1") {
    document.getElementById("login-screen").style.display = "none";
    loadAll();
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("loading-screen").style.display = "none";
    setTimeout(() => {
      const inp = document.getElementById("pwd-input");
      if (inp) inp.focus();
    }, 100);
  }
}

initAuth();
